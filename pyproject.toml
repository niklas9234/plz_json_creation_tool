[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dienstleisterkarten"
version = "0.1.0"
description = "Offline-Verwaltung und GeoJSON-Export von Dienstleistergebieten"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.6"]

[project.optional-dependencies]
test = ["pytest>=8"]
build = ["pyinstaller>=6"]

[project.scripts]
dienstleisterkarten = "app.main:main"
dienstleisterkarten-import = "initial_import.importer:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*", "initial_import*"]
